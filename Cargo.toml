[workspace]
resolver = "3"
members = [
  "crates/almanac-core",
  "crates/almanac-seal",
  "crates/almanac-keyfile",
  "crates/almanac-store",
  "crates/eventlog",
  "crates/memfiles",
  "crates/memfiles-format",
  "crates/recall",
  "crates/almanac-settings",
  "crates/almanac-tidy",
  "crates/almanac-search",
  "crates/almanac-service",
  "crates/almanac-infer",
  "crates/almanac-host",
  "crates/almanac-watch",
  "crates/almanac-dbus",
  "crates/almanac-dbus-serve",
  "crates/almanac-client",
  "crates/almanac-local",
  "crates/almanac-fake",
  "crates/memoryd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# What quire declares; the toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/almanac"
publish = false

[workspace.dependencies]
almanac-core    = { path = "crates/almanac-core" }
almanac-seal    = { path = "crates/almanac-seal" }
almanac-keyfile = { path = "crates/almanac-keyfile" }
almanac-store   = { path = "crates/almanac-store" }
eventlog        = { path = "crates/eventlog" }
memfiles        = { path = "crates/memfiles" }
memfiles-format = { path = "crates/memfiles-format" }
recall          = { path = "crates/recall" }
almanac-settings = { path = "crates/almanac-settings" }
almanac-tidy    = { path = "crates/almanac-tidy" }
almanac-search  = { path = "crates/almanac-search" }
almanac-service = { path = "crates/almanac-service" }
almanac-infer   = { path = "crates/almanac-infer" }
almanac-host    = { path = "crates/almanac-host" }
almanac-watch   = { path = "crates/almanac-watch" }
almanac-dbus    = { path = "crates/almanac-dbus" }
almanac-dbus-serve = { path = "crates/almanac-dbus-serve" }
almanac-client  = { path = "crates/almanac-client", default-features = false }
almanac-local   = { path = "crates/almanac-local" }
almanac-fake    = { path = "crates/almanac-fake" }

# porter's frozen interfaces, by git at a pinned rev (quire CONSUMING.md section 1; a local checkout
# overrides it through a [patch], FINDINGS.md "Cross-repo dependencies"). porter has no almanac dependency, so there
# is no cycle. memoryd reaches inferd through porter-client (and its tests serve a fake inferd with
# porter-dbus); almanac never names stoker itself
# (porter-infer does, by its own git rev).
porter-core     = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7" }
porter-ids      = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7" }
porter-capability = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7" }
porter-match    = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7" }
porter-wire     = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7" }
prov            = { git = "https://github.com/PoHsuanLai/prov", rev = "f6cc175c4c6d815b6faa3d58b7875ca00def836d" }
porter-infer    = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7" }
porter-client   = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7", features = ["infer"] }
porter-dbus     = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7" }
porter-daemon   = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7" }
porter-callers  = { git = "https://github.com/PoHsuanLai/porter", rev = "ad54ea46a9d6ef23039371f5f12c1ed8fccb4cb7" }

# From quire's pinned block (`docs/workspace-deps.toml`), copied verbatim: only the lines almanac
# names itself.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }  # shell repos only; they also enable ds-settings/tokio. quire itself builds zbus with its async-io default so app consumers keep their own executor.
toml = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
notify = "8.2"
blake3 = "1"
# almanac-seal.
chacha20poly1305 = "0.10"
zeroize = "1"
getrandom = "0.3"
# eventlog, recall: SQLCipher built from source with a vendored OpenSSL (spike S-SQL: FTS5 works
# in an encrypted DB, a wrong key fails, licences pass the allow-list).
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
tar = "0.4"
oo7 = "0.6"
# memoryd's Landlock sandbox (no unsafe of ours: the crate wraps the syscalls). Not yet in quire's
# pinned block (`docs/workspace-deps.toml`): it joins there first (interface ask in FINDINGS).
landlock = "0.4"
# memoryd's removal notes: write to a temp file, fsync, rename over (BSD-3-Clause, in deny.toml's list).
atomic-write-file = "0.3"
# Hex text of digests, replica ids and keys (almanac-core's `decode_lower_hex` keeps the lowercase-only rule).
const-hex = "1.19"
# Fact ids: a ULID with the clock and entropy injected (almanac-core `FactId::mint`).
ulid = { version = "3", default-features = false }
# Dev-dependencies.
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
