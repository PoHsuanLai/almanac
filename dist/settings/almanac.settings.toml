# almanac's settings schema in the design/22 format (section 9.2). Installed to
# $XDG_DATA_DIRS/quire/settings/almanac.settings.toml; `memoryd --write-schema <dir>` writes it for a
# local install. The values live in $XDG_CONFIG_HOME/almanac/settings.toml, for example `[memory.files]`
# then `at_rest = "plain"`; memoryd reads them live (crates/almanac-service/src/settings). Every row
# is hands-off for an agent (no `agent = "settable"`): memory.* is never agent-settable, so the
# companion can never loosen what memory keeps or how it is held. The rows design/22 section 5 puts
# on the Intelligence page are Memory's two; the others (Memory, History) are Advanced. Not here, because nothing
# reads it yet: `memory.join_window_ms` (memoryd does not run the file watch yet). See FINDINGS.
app = "almanac"
file = "almanac/settings.toml"
version = 1

[[key]]
path = "memory.files.at_rest"
default = "sealed"
label = "Memory files"
help = "Private keeps memory files encrypted, readable only through memory. Readable by apps keeps ordinary files that any app on this computer can read. Spaces already made keep their setting."
section = "Memory"
exposure = "basic"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["sealed", "plain"]

[key.page]
kind = "intelligence"

[key.labels]
sealed = "Private"
plain = "Readable by apps"

[[key]]
path = "memory.consolidation.when"
default = "nightly"
label = "Tidy memory"
help = "Reads what happened, proposes facts and tidies the memory files. You can undo any run. Nightly is the default."
section = "Memory"
exposure = "basic"

[key.kind]
kind = "segmented"

[key.kind.v]
variants = ["nightly", "manual", "never"]

[key.page]
kind = "intelligence"

[key.labels]
nightly = "Nightly"
manual = "When I ask"
never = "Never"

[[key]]
path = "memory.consolidation.apply"
default = "auto"
label = "Apply tidying"
help = "Right away applies each run as soon as it is drafted, and you can undo it. After I review waits for you to approve."
section = "Memory"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["auto", "review"]

[key.page]
kind = "intelligence"

[key.labels]
auto = "Right away"
review = "After I review"

[[key]]
path = "memory.retention.search_days"
default = 30
label = "Search history"
help = "How long searches and selections are remembered."
section = "History"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 1
max = 3650
unit = "days"

[key.page]
kind = "intelligence"

[[key]]
path = "memory.retention.file_unexplained_days"
default = 7
label = "Unexplained edits"
help = "How long a file change that no app explained is remembered."
section = "History"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 1
max = 3650
unit = "days"

[key.page]
kind = "intelligence"

[[key]]
path = "memory.retention.session_days"
default = 30
label = "Task history"
help = "How long the assistant's tasks and computer-use runs are remembered."
section = "History"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 1
max = 3650
unit = "days"

[key.page]
kind = "intelligence"

[[key]]
path = "memory.retention.audit_body_days"
default = 90
label = "Activity details"
help = "How long the details of permission and memory events are kept."
section = "History"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 1
max = 3650
unit = "days"

[key.page]
kind = "intelligence"

[[key]]
path = "memory.retention.audit_header_days"
default = 365
label = "Activity records"
help = "How long the bare record of those events is kept after their details are gone."
section = "History"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 1
max = 3650
unit = "days"

[key.page]
kind = "intelligence"

[[key]]
path = "memory.pending_ttl_days"
default = 14
label = "Unsure facts"
help = "How long a fact the assistant is unsure of waits for you to accept or discard it before it is dropped."
section = "History"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 1
max = 365
unit = "days"

[key.page]
kind = "intelligence"
