# Who may call memoryd (org.quire.Memory1): a caller is the systemd unit behind the bus
# connection (the bus names its process, /proc/<pid>/cgroup names the unit). An app in its own
# app scope (app-<id>-<n>.scope) or Flatpak scope is an app without a row here; any process in
# neither (a terminal's child, an unlisted unit) is refused.
#
# The shell runs as sill.service and the System Settings app as org.quire.Settings.service. A scope
# never carries a fixed role (porter's caller table gives a scope row a plain app's standing), so
# neither has a scope row.
#
# Install as /etc/quire/memory-callers.toml; the user's ~/.config/quire/memory-callers.toml is
# laid over it (a user row replaces the system row for the same unit).
#
# The four fixed callers are told apart by role and app together:
#   role "agent"      + app org.quire.Intents -> the router (intentd)
#   role "cua"                                -> cuad
#   role "sheet_host" + app org.quire.Shell   -> the shell (sill)
#   role "settings"   + app org.quire.Settings -> the Settings app (detent)
# Every other row is an app with that identity.

[[caller]]
app = "org.quire.Intents"
unit = "intentd.service"
role = "agent"

[[caller]]
app = "org.quire.Cua"
unit = "cuad.service"
role = "cua"

[[caller]]
app = "org.quire.Shell"
unit = "sill.service"
role = "sheet_host"
exe = ["/usr/bin/sill", "/usr/local/bin/sill", "/opt/quire/releases/*/bin/sill"]

[[caller]]
app = "org.quire.Settings"
unit = "org.quire.Settings.service"
role = "settings"
exe = ["/usr/bin/detent", "/usr/local/bin/detent", "/opt/quire/releases/*/bin/detent"]

[[caller]]
app = "org.quire.Companion"
unit = "companiond.service"
role = "agent"

[[caller]]
app = "org.quire.Reader"
unit = "readerd.service"
role = "agent"
