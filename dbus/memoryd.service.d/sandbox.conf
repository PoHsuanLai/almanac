# memoryd's mount-namespace protections.
# Why this is a separate file: each setting below gives the daemon a private view of the file
# system, the network or the kernel. In a user manager (systemd --user) that needs an
# unprivileged user namespace, and some systems refuse it: Ubuntu 24.04 and later turn it off for
# programs without an AppArmor profile, and the unit then fails to start with 226/NAMESPACE. The
# installer (scripts/install.sh) tests for that and installs this file only where it works. What
# needs no namespace (no new privileges, the address families) stays in the unit. Without this
# file memoryd still keeps its Landlock policy (the kernel limits it to its own directories).
[Service]
# Paths are `-` prefixed because they do not exist before the first run.
PrivateNetwork=yes
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=-%h/.local/share/quire/memory -%h/.cache/quire/memory -%h/.config/quire -%t/quire/memory
ProtectKernelTunables=yes
ProtectControlGroups=yes
