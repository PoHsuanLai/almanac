[package]
name = "almanac-service"
description = "memoryd's core over seams: authorisation, the Space and forget machines, the run that drives almanac-tidy's fact and consolidation machines over a backend, retention, the readers (search itself is almanac-search's), timeline assembly, export, the per-Space request queue, and MemoryService."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
almanac-core = { workspace = true }
almanac-seal = { workspace = true }
almanac-search = { workspace = true }
almanac-settings = { workspace = true }
almanac-tidy = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
almanac-store = { workspace = true }
memfiles-format = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
almanac-fake = { workspace = true }
almanac-seal = { workspace = true, features = ["testing"] }
eventlog = { workspace = true, features = ["testing"] }
tokio = { workspace = true }

[lints]
workspace = true
