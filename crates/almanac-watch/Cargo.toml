[package]
name = "almanac-watch"
description = "File-change capture: the FileWatch seam, InotifyWatch, and the pure join of observed changes with the reasons apps supply."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
almanac-core = { workspace = true }
blake3 = { workspace = true }
notify = { workspace = true, optional = true }
thiserror = { workspace = true }

[features]
default = ["linux"]
# `InotifyWatch`: notify's inotify backend. Off elsewhere; `join` and the seam stay portable.
linux = ["dep:notify"]
# blake3's portable Rust implementation, for a cross build with no C compiler for the target.
pure-hash = ["blake3/pure"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
