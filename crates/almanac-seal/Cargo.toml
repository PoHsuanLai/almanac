[package]
name = "almanac-seal"
description = "almanac's per-Space keys, subkey derivation, the sealed-file format and the key store seam."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
almanac-core = { workspace = true }
blake3 = { workspace = true }
chacha20poly1305 = { workspace = true }
getrandom = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
oo7 = { workspace = true, optional = true }

[dev-dependencies]
almanac-seal = { path = ".", features = ["testing", "oo7", "test-keys"] }
tokio = { workspace = true }
tempfile = { workspace = true }

[features]
# `MemoryKeys`, for tests and almanac-fake.
testing = []
# `Oo7Keys`, the Secret Service key store.
oo7 = ["dep:oo7"]

# `FileKeys`: keys in a sealed file, for a jailed test with no Secret Service. TEST ONLY: never
# enabled in a release or dist build (memoryd's `test-keys` feature turns it on).
test-keys = []

[lints]
workspace = true
