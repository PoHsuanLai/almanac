[package]
name = "memoryd"
description = "almanac's memory daemon: serves org.quire.Memory1 over almanac-service, with the real seams (Secret Service keys, SQLCipher, sealed files, inferd models)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `MEMORYD_KEYS=file:<path>` selects a file-backed key store (`almanac_keyfile::FileKeys`), for a
# jailed acceptance run with no Secret Service. TEST ONLY: off by default, never in a release or
# dist build; without it the variable is ignored.
test-keys = ["dep:almanac-keyfile"]
# `MEMORYD_PROC_ROOT=<dir>` makes the daemon read `<dir>/<pid>/cgroup` for its callers instead of
# `/proc/<pid>/cgroup`, so an acceptance run can present its test processes as units. TEST ONLY:
# off by default, never in a release or dist build (check-boundary.sh fails if a default build
# has it); without it the variable is ignored.
test-proc-root = ["porter-dbus/test-proc-root"]

[dependencies]
almanac-core = { workspace = true }
almanac-seal = { workspace = true, features = ["oo7"] }
almanac-keyfile = { workspace = true, optional = true }
eventlog = { workspace = true }
almanac-store = { workspace = true }
memfiles = { workspace = true }
recall = { workspace = true }
almanac-local = { workspace = true }
almanac-host = { workspace = true }
almanac-service = { workspace = true }
almanac-settings = { workspace = true }
almanac-watch = { workspace = true }
atomic-write-file = { workspace = true }
almanac-dbus = { workspace = true }
porter-core = { workspace = true }
porter-daemon = { workspace = true }
porter-dbus = { workspace = true }
porter-infer = { workspace = true }
porter-client = { workspace = true, features = ["dbus"] }
clap = { workspace = true }
getrandom = { workspace = true }
landlock = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
zbus = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
# The tests present their processes as a fixture tree, which porter reads only in a test build.
memoryd = { path = ".", features = ["test-proc-root"] }
almanac-client = { workspace = true, features = ["dbus"] }
almanac-fake = { workspace = true }
almanac-seal = { workspace = true, features = ["testing", "oo7"] }
recall = { workspace = true, features = ["testing"] }
tar = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
