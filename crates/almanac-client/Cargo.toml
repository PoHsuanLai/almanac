[package]
name = "almanac-client"
description = "The app-facing memory API: Memory over a Transport (in process, absent, or D-Bus)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
almanac-core = { workspace = true }
almanac-service = { workspace = true, optional = true }
almanac-dbus = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
almanac-fake = { workspace = true }
almanac-seal = { workspace = true }
tokio = { workspace = true }

[features]
# The app-level desktop switch (design/36): on by default, an app on macOS or Windows builds with
# `default-features = false` and `in_process`. It says "this app is on the Quire desktop"; the
# platform feature it implies (`dbus`, what the OS provides) keeps its name.
default = ["quire-desktop"]
quire-desktop = ["dbus"]
# Hosting the service in the app (`InProcess`, tests, single-process embedders). Off by default,
# so a D-Bus client does not link SQLCipher or OpenSSL.
in_process = ["dep:almanac-service"]
# The D-Bus transport (Linux, the desktop's memoryd).
dbus = ["dep:almanac-dbus"]

[lints]
workspace = true
